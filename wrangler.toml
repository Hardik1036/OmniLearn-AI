name = "omnilearn-exam-ai"
main = "backend/src/main.py"
compatibility_date = "2025-03-01"
compatibility_flags = ["python_workers"]

[assets]
directory = "./frontend"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
binding = "ASSETS"

[vars]
RUNTIME_MODE = "system_app"

# Replace database_id after running: npx wrangler d1 create omnilearn-db
[[d1_databases]]
binding = "DB"
database_name = "omnilearn-db"
database_id = "99ffa183-d55e-4897-a585-b91766ec0db4"

# Zero-egress Cloudflare R2 object storage for lecture slides and installers
# Provision via: npx wrangler r2 bucket create omnilearn-slides
[[r2_buckets]]
binding = "SLIDES_BUCKET"
bucket_name = "omnilearn-slides"

# Provision via: npx wrangler r2 bucket create omnilearn-releases
[[r2_buckets]]
binding = "RELEASES_BUCKET"
bucket_name = "omnilearn-releases"

# Replace id after running: npx wrangler kv namespace create APP_CACHE
[[kv_namespaces]]
binding = "APP_CACHE"
id = "4e909a1df2124dc0ad15ba3c655f2444"
